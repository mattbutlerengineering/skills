# Publishes this repo's assembly line (the assembly-line skill's page) to
# GitHub Pages at https://mattbutlerengineering.github.io/skills/. The page
# is generated from the checkout's run artifacts on every push to main
# that changes one of its inputs, so it always shows main's runs; nothing
# generated is committed. Root-only: it is not in factory_init.MIRRORS, so
# a stamped repo never gets it.
name: pages

on:
  push:
    branches: [main]
    # The page's inputs, and nothing else: the run directories
    # knowledge_plane.run_dirs walks (docs/, docs/features/*, docs/fixes/*),
    # assembly_line.py with every repo module it imports, its template and
    # the vendored library. 124 of 469 pushes to main measured on
    # 2026-11-11 changed none of them and rebuilt an identical page.
    # tests/test_assembly_line.py holds the module list to the tool's
    # import closure.
    paths:
      - "docs/*.md"
      - "docs/features/**"
      - "docs/fixes/**"
      - "assembly_line.py"
      - "assembly_line.html"
      - "board.py"
      - "cli.py"
      - "knowledge_plane.py"
      - "protocol.py"
      - "vendor/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the assembly line page
        run: python3 assembly_line.py . --publish _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
