# Publishes this repo's assembly line (the assembly-line skill's page) to
# GitHub Pages at https://mattbutlerengineering.github.io/skills/. The page
# is generated from the checkout's run artifacts on every push to main, so
# it always shows main's runs; nothing generated is committed. Root-only:
# it is not in factory_init.MIRRORS, so a stamped repo never gets it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the assembly line page
        run: python3 assembly_line.py . --publish _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
