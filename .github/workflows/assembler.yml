# The factory assembler (PRD-0001; ADR-0032 dispatch plane, ADR-0033 gates,
# ADR-0034 routing bands).
#
# Mirrored VERBATIM into the template payload by `factory_init.py
# update-manifest`, so a stamped product repo runs this same file — which is
# why it names no commands of its own. The one step that needs judgment goes
# through `make assembler` (assembler.py, unit-tested offline); the agent it
# dispatches is a `uses:` action, not a command. Editing this file means
# re-running update-manifest; detector E fails the build otherwise.
#
# Two guards here are security properties, not conveniences (ADR-0032):
#   - only the repo owner may apply wo:ready-for-agent — the job if: enforces
#     it (a non-owner never spins the job up), and assembler.actor_is_owner
#     re-checks it as the tested authority, failing closed;
#   - the dispatched agent's prompt substrate is the repo-controlled breakdown
#     ROW, never the raw issue body (the prompt-injection boundary). The issue
#     body never leaves this workflow — assembler.py resolves the row instead.
name: assembler

on:
  issues:
    types: [labeled]

# A repeat label event QUEUES behind the running dispatch — this group
# serializes, it does not dedupe. The claim step below is what makes the
# repeat a no-op: by the time it runs, the order is no longer in ready
# state, transitioned=false, and the agent step is skipped.
concurrency:
  group: assembler-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    # The whole gate, physical not conventional (ADR-0032): the applied label
    # is wo:ready-for-agent AND the labeler is the repo owner AND the monthly
    # circuit breaker has not tripped (cost-report.yml sets FACTORY_PAUSED on
    # a cap breach — ADR-0034; this term is its one reader). A label from
    # anyone or anything else is inert — the job simply never runs.
    if: >-
      github.event.label.name == 'wo:ready-for-agent'
      && github.event.sender.login == github.repository_owner
      && vars.FACTORY_PAUSED != 'true'
    runs-on: ubuntu-latest
    # ADR-0034's wall-clock stop (WO-0034): a generous outer bound, not
    # the budget — the dollar budget is the routing band's job. A size-L
    # order's agent run fits comfortably; a hung run cannot outlive it.
    timeout-minutes: 60
    # The chartered agent branches, pushes, and opens a PR; it never merges
    # its own PR — gate 3 requires an independent, non-authoring reviewer
    # (ADR-0033, amended by ADR-0036). No merge permission is granted here.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # For the validator hand-off only (gh workflow run, WO-0030) — the
      # agent's PR is GITHUB_TOKEN-authored, so its pull_request events
      # are suppressed and gate 3 must be dispatched by name.
      actions: write
    env:
      # Job-level so a step if: can gate on the secrets' PRESENCE — secrets are
      # not readable in an if:, but an env sourced from one is. This is our
      # equivalent of the sweeps sentry job's `vars.* != ''` graceful skip:
      # no credential configured -> the agent step is skipped, never a
      # fabricated run. Two credentials, either satisfies: an API key, or the
      # subscription OAuth token `claude setup-token` mints (the operator's
      # Max plan issues no API key — the action accepts both inputs and an
      # empty string reads as not-provided).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Resolve the dispatch from the REPO-CONTROLLED breakdown row (never the
      # issue body). Re-runs the owner check as the tested authority and emits
      # dispatch/charter/band/model/prompt to $GITHUB_OUTPUT. A non-owner or
      # non-ready label resolves to dispatch=false; a misconfiguration (a ready
      # label on an issue with no work-order row) fails the run so it is seen.
      - name: Resolve the work order from its breakdown row
        id: resolve
        env:
          FACTORY_REPO_OWNER: ${{ github.repository_owner }}
        run: make assembler
      # Claim the order: ready -> in-progress (ADR-0032's state machine,
      # advanced by machinery, not memory). transitioned=false means a
      # repeat/stale event — the agent step is skipped, no second paid run.
      # A benign no-op exits 0; only a flip that cannot verify the order's
      # state fails the step. Gated on the API key exactly like the agent
      # step: a repo that can never dispatch must not mark orders
      # in-progress, or the graceful skip would fake a working agent.
      - name: Claim the work order
        id: claim
        if: >-
          steps.resolve.outputs.dispatch == 'true'
          && (env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make wo-in-progress ISSUE=${{ github.event.issue.number }}
      # The chartered agent, on the model its charter's band routes to. Skips
      # gracefully when no credential is configured (the graceful-skip
      # pattern): nothing is dispatched, nothing is labelled, nothing is
      # faked. Both auth inputs are passed; the action treats an empty one
      # as absent, so whichever secret exists wins.
      - name: Run the chartered agent
        id: agent
        if: >-
          steps.resolve.outputs.dispatch == 'true'
          && steps.claim.outputs.transitioned == 'true'
          && (env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != '')
        # Pinned by SHA: this job holds write scopes + the API key, so its
        # third-party code must change only by reviewed commit, never by a
        # re-pointed tag. Bump deliberately: re-resolve the tag, update the
        # SHA and the comment.
        uses: anthropics/claude-code-action@86180fa9e4d311eed10c9cc49854c53dab5d517a  # v1 as of 2026-08-04
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.resolve.outputs.prompt }}
          # --max-turns is ADR-0034's second mechanical stop (WO-0034):
          # like the job timeout, a backstop a runaway loop cannot argue
          # with — generous enough that no honest size-L run meets it.
          # --allowedTools: automation mode denies Bash unless named here,
          # and the SWE's exit (branch, commit, push, verify, open the PR)
          # is all Bash — the first live dispatch (issue #536) was denied
          # nine times and delivered no PR. The one allowed push is this
          # order's own branch, exactly (assembler.branch_for): no branch
          # protection guards main on this plan, so this list is the push
          # boundary. A `wo-:*` prefix rule never matched `wo-0074` (run
          # 36083668042) — a `:*` prefix ends at a word boundary.
          claude_args: >-
            --model ${{ steps.resolve.outputs.model }} --max-turns 100
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin ${{ steps.resolve.outputs.branch }}),Bash(gh pr create:*),Bash(gh issue view:*),Bash(make:*),Bash(python3:*)"
      # The run's own spend, machine-written to the append-only cost ledger
      # (issue #222; ADR-0034): tokens and cost come from the action's
      # execution file — the harness's record, never a hand-typed figure.
      # always(): a failed agent still spent money, and its outcome says so.
      # continue-on-error: a ledger refusal must not flip a finished order
      # to wo:failed — the miss shows red on this step, and detector G reds
      # the merge if the line truly never lands (the gating backstop).
      # The execution file lists every denied tool call; the log shows only
      # the count. Run 35956750804 reported 7 denials and left nothing to
      # read them from — keep the file as an artifact, pass or fail.
      - name: Keep the agent's execution file
        if: always() && steps.agent.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-execution-${{ steps.resolve.outputs.wo }}
          path: ${{ steps.agent.outputs.execution_file }}
          retention-days: 14
      - name: Record the run's spend in the cost ledger
        id: record
        if: >-
          always()
          && steps.claim.outputs.transitioned == 'true'
          && steps.agent.outputs.execution_file != ''
        continue-on-error: true
        run: >-
          make wo-record WO=${{ steps.resolve.outputs.wo }}
          RUN_ID=${{ github.run_id }}
          MODEL=${{ steps.resolve.outputs.model }}
          FILE=${{ steps.agent.outputs.execution_file }}
          OUTCOME=${{ steps.agent.outcome == 'success' && 'completed' || 'agent-failed' }}
      # The row wo-record just appended exists only on this runner — with
      # no push, every dispatched run's spend is discarded with the
      # checkout and the monthly circuit breaker never sees it (WO-0031;
      # review.md major: the #222 gap surviving its own fix). The agent
      # step may have left the workspace on its WO branch, so the row is
      # re-applied to a fresh origin/main worktree and pushed from there —
      # never from HEAD, which could smuggle agent commits onto main.
      # tail -1 IS the appended row: wo-record appends exactly one line
      # and runs after every other writer in this job. continue-on-error
      # mirrors the record step — a lost row shows red here, and detector
      # G reds the merge if the line truly never lands.
      - name: Commit the run's spend row
        if: >-
          always()
          && steps.record.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add "$RUNNER_TEMP/spend" origin/main
          tail -n 1 docs/factory/costs.jsonl >> "$RUNNER_TEMP/spend/docs/factory/costs.jsonl"
          git -C "$RUNNER_TEMP/spend" add docs/factory/costs.jsonl
          git -C "$RUNNER_TEMP/spend" commit -m "chore(factory): run-spend row (assembler)"
          git -C "$RUNNER_TEMP/spend" push origin HEAD:main
      # GitHub suppresses pull_request events for PRs the GITHUB_TOKEN
      # opens, so the agent's PR would otherwise reach gate 3 with no
      # check, no reviewer, and no queue entry (WO-0030). find-pr joins
      # the delivered PR to this order by its Closes link (assembler.py,
      # the tested authority — never a branch-name convention), and the
      # hand-off uses workflow_dispatch, the one event GitHub exempts
      # from the suppression. An agent that ran but delivered no
      # traceable PR fails the find step — the owner must see that, and
      # the failure() step below flips the order to wo:failed.
      - name: Find the agent's PR
        id: find
        if: >-
          steps.resolve.outputs.dispatch == 'true'
          && steps.claim.outputs.transitioned == 'true'
          && (env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make find-pr ISSUE=${{ github.event.issue.number }}
      - name: Trigger the validator on the agent's PR
        if: steps.find.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run validator.yml -f pr=${{ steps.find.outputs.pr }}
      # The order's exit when the run dies (ADR-0032's terminal state,
      # ADR-0045's writer): without this the dispatched agent's failure
      # leaves the order on wo:in-progress forever, where the gate digest
      # and the improvement routine both read it as work still in flight.
      # Gated on the claim's own verdict, not just failure(): only an order
      # THIS run took out of ready may be flipped — a run that died before
      # or during the claim leaves the order's state exactly as it found it.
      # ADR-0063: a terminal verdict requires having looked. find-pr
      # writes looked=false when it could not observe the agent's
      # delivery at all (an unusable gh, or a full window). `!=` not
      # `==`: an unset output means the find step never ran, and a run
      # that died before it must still flip.
      - name: Mark the work order failed
        if: >-
          failure()
          && steps.claim.outputs.transitioned == 'true'
          && steps.find.outputs.looked != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make wo-failed ISSUE=${{ github.event.issue.number }}
