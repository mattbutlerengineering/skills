name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural lint
        run: python3 lint.py
      - name: Factory gate detectors
        run: python3 gates.py && python3 gates.py --selftest
      - name: Orientation decision-table tests
        run: python3 -m unittest discover tests
