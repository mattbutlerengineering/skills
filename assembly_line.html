<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assembly line</title>
<style>
  :root {
    --ground: #e8f5ec; --ink: #2b2b33; --muted: #6b6b78;
    --belt: #a6e07a; --accent: #8f6fd8; --warn: #d9822b; --panel: #ffffff;
    --line: #2f3238;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground);
    color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI",
    sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 1rem; align-items: baseline;
    padding: .6rem 1rem; flex: none; }
  header h1 { font-size: 1.05rem; margin: 0; }
  header .meta { color: var(--muted); }
  #notice { margin: 0 1rem .5rem; padding: .5rem .75rem; border-radius: 6px;
    background: #fff4e5; color: #6b3d00; flex: none; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #empty-sign { position: absolute; left: 50%; top: 45%;
    transform: translate(-50%, -50%); background: var(--panel);
    border: 2px solid var(--line); border-radius: 8px; padding: .8rem 1.2rem;
    font-weight: 600; pointer-events: none; }
  #fallback { display: grid; gap: .75rem; padding: 0 1rem 1rem;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    overflow: auto; flex: 1; }
  #fallback section { background: var(--panel); border-radius: 8px;
    padding: .6rem .75rem; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
  #fallback h2 { font-size: .95rem; margin: 0 0 .35rem;
    display: flex; justify-content: space-between; }
  #fallback h2 .count { color: var(--muted); font-weight: normal; }
  #fallback ul { margin: 0; padding-left: 1.1rem; }
  #fallback li { overflow-wrap: anywhere; }
  #fallback .empty { color: var(--muted); margin: 0; }
  #fallback section.attention h2 { color: var(--warn); }
  .card { position: absolute; pointer-events: none; background: var(--panel);
    border: 2px solid var(--line); border-radius: 8px; padding: .5rem .7rem;
    max-width: 320px; box-shadow: 0 4px 0 rgba(0,0,0,.12); z-index: 3; }
  .card h3 { margin: 0 0 .15rem; font-size: .8rem; letter-spacing: .06em;
    text-transform: uppercase; }
  .card p { margin: .1rem 0; }
  .card .muted, #panel .muted { color: var(--muted); }
  #panel { position: absolute; top: .5rem; right: .5rem; bottom: .5rem;
    width: 340px; background: var(--panel); border: 2px solid var(--line);
    border-radius: 10px; display: flex; flex-direction: column; z-index: 4; }
  #panel header { justify-content: space-between; padding: .6rem .8rem;
    border-bottom: 1px solid #ddd; }
  #panel header h2 { margin: 0; font-size: .95rem; }
  #panel header button { border: 0; background: none; font-size: 1.1rem;
    cursor: pointer; }
  #panel .body { overflow: auto; padding: .4rem .8rem .8rem; }
  #panel details { border-bottom: 1px solid #eee; padding: .25rem 0; }
  #panel summary { cursor: pointer; display: flex; gap: .5rem;
    justify-content: space-between; overflow-wrap: anywhere; }
  #panel summary .prog { color: var(--muted); white-space: nowrap; }
  #panel ul { margin: .2rem 0 .2rem 1rem; padding: 0; list-style: none; }
  #panel li.done::before { content: "☑ "; }
  #panel li.open::before { content: "☐ "; }
  #transport { flex: none; display: grid; gap: .2rem .8rem;
    grid-template-columns: auto 1fr auto auto auto; align-items: center;
    padding: .5rem 1rem .6rem; background: rgba(255,255,255,.65);
    border-top: 1px solid rgba(0,0,0,.08); }
  #transport button { font: inherit; padding: .3rem .7rem; border-radius: 6px;
    border: 2px solid var(--line); background: var(--panel); cursor: pointer; }
  #transport button[aria-pressed="true"] { background: var(--belt); }
  #transport button:disabled, #transport input:disabled { opacity: .45;
    cursor: default; }
  #scrub { width: 100%; accent-color: var(--accent); }
  #day { font-variant-numeric: tabular-nums; min-width: 6.5rem; }
  #honesty { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; }
  #export-status { grid-column: 1 / -1; font-size: .8rem; }
  .speed { display: flex; gap: .25rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 id="title">Assembly line</h1>
  <span class="meta" id="meta"></span>
</header>
<p id="notice" hidden></p>
<div id="stage" hidden>
  <div id="empty-sign" hidden>No runs yet — start one with /idea</div>
  <div class="card" id="card" hidden></div>
  <aside id="panel" hidden aria-label="Pinned detail">
    <header><h2 id="panel-title"></h2>
      <button id="panel-close" aria-label="Close panel">✕</button></header>
    <div class="body" id="panel-body"></div>
  </aside>
</div>
<main id="fallback" hidden></main>
<footer id="transport" hidden>
  <button id="play" aria-label="Play the replay" disabled>▶ Play</button>
  <input id="scrub" type="range" min="0" max="0" step="1" value="0"
         aria-label="Replay date" disabled>
  <span id="day"></span>
  <span class="speed" role="group" aria-label="Replay length">
    <button id="speed-30" aria-pressed="true" disabled>30s</button>
    <button id="speed-60" aria-pressed="false" disabled>60s</button>
  </span>
  <button id="export" disabled>Export clip</button>
  <span id="honesty">Dates to the day from artifact frontmatter; order
    within a day is inferred; work-order progress is today's.</span>
  <span id="export-status" role="status" hidden></span>
</footer>

<script id="model" type="application/json">__MODEL__</script>
<script id="three-core" type="text/plain">__THREE_CORE__</script>
<script id="three-module" type="text/plain">__THREE_MODULE__</script>
<script type="module">
// The page derives no pipeline fact: placement, history and work orders
// are the model's (assembly_line.py). Everything here is drawing.
const STATION_INFO = {
  "capture": ["Capture", "Opens a returned crate: a defect or condition brief is written."],
  "idea": ["Idea", "Builds a new crate: the idea brief is written."],
  "prd": ["PRD", "Stamps the spec sheet: requirements and success criteria."],
  "ux-design": ["UX Design", "Sketches what the user sees: flows and screens."],
  "architect": ["Architect", "Lowers the blueprint: the technical design."],
  "decompose": ["Decompose", "Opens the crate into parts: one per work order."],
  "implement": ["Implement", "Assembles the parts: the code, work order by work order."],
  "verify": ["Verify", "Scans the build against the PRD's criteria."],
  "review": ["Review", "Inspects the change and stamps approval."],
  "ship": ["Ship", "Packs and loads the release."],
  "operate": ["Operate", "Shipped, waiting on a retro."],
  "completed": ["Completed", "Finished runs: retro written, on the shelves."]
};
const REQUIRED = ["generated", "repo", "stations", "runs", "timeline"];
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

function readModel() {
  try { return JSON.parse($("model").textContent); } catch (err) { return null; }
}
function missingKey(model) {
  if (!model || typeof model !== "object") return "model";
  return REQUIRED.find((key) => !(key in model)) || null;
}
const nameOf = (station) => (STATION_INFO[station] || [station])[0];
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([key, value]) => {
    if (key === "class") node.className = value; else node.setAttribute(key, value);
  });
  children.forEach((child) => node.append(child));
  return node;
}
const doneCount = (run) => run.work_orders.filter((wo) => wo.done).length;

// ---------------------------------------------------------------- fallback
function showFallback(model, notice) {
  $("notice").textContent = notice;
  $("notice").hidden = false;
  $("stage").hidden = true;
  $("transport").hidden = true;
  const main = $("fallback");
  main.replaceChildren();
  const runs = Array.isArray(model && model.runs) ? model.runs : [];
  const stations = Array.isArray(model && model.stations) && model.stations.length
    ? model.stations : Object.keys(STATION_INFO);
  const section = (title, list, cls, describe) => {
    const box = el("section", {class: cls || ""},
      el("h2", {}, title, el("span", {class: "count"}, String(list.length))));
    if (!list.length) box.append(el("p", {class: "empty"}, "No runs here"));
    else {
      const ul = el("ul", {});
      list.forEach((run) => ul.append(el("li", {}, describe(run))));
      box.append(ul);
    }
    return box;
  };
  const label = (run) => run.station === "implement" && run.work_orders.length
    ? `${run.ref} · ${doneCount(run)}/${run.work_orders.length}` : run.ref;
  stations.forEach((station) => main.append(
    section(nameOf(station), runs.filter((run) => run.station === station), "", label)));
  main.append(section("Needs attention", runs.filter((run) => run.status === "attention"),
    "attention", (run) => `${run.dir} — ${run.reason}`));
  main.hidden = false;
}

function setHeader(model, day) {
  const runs = Array.isArray(model && model.runs) ? model.runs : [];
  const at = day || (model && model.generated ? model.generated.slice(0, 10) : "");
  const placed = day ? runs.map((run) => stationAt(run, day)) : runs.map((run) => run.station);
  const active = placed.filter((s) => s && s !== "completed").length;
  const completed = placed.filter((s) => s === "completed").length;
  $("title").textContent = (model && model.repo) || "Assembly line";
  $("meta").textContent = `${active} active · ${completed} completed${at ? ` · as of ${at}` : ""}`;
}

function webglAvailable() {
  try {
    const canvas = document.createElement("canvas");
    return !!(canvas.getContext("webgl2") || canvas.getContext("webgl"));
  } catch (err) { return false; }
}

// ------------------------------------------------------------- the timeline
const DAY_MS = 86400000;
const dayIndex = (iso) => Math.round(Date.parse(iso + "T00:00:00Z") / DAY_MS);
const isoOf = (index) => new Date(index * DAY_MS).toISOString().slice(0, 10);
function stationAt(run, day) {
  if (run.status === "attention") return null;
  let station = null;
  for (const hop of run.history) { if (hop.day <= day) station = hop.station; }
  return station;
}
// Within a played day a run's arrivals are spread evenly in stage order.
function hopTimes(run) {
  const byDay = {};
  run.history.forEach((hop) => { (byDay[hop.day] = byDay[hop.day] || []).push(hop); });
  return run.history.map((hop) => {
    const same = byDay[hop.day];
    return {hop, t: dayIndex(hop.day) + same.indexOf(hop) / same.length};
  });
}

// --------------------------------------------------------------- three.js
async function loadThree() {
  const decode = (id) => atob($(id).textContent.trim());
  const bytes = (text) => Uint8Array.from(text, (c) => c.charCodeAt(0));
  const coreUrl = URL.createObjectURL(new Blob([bytes(decode("three-core"))],
    {type: "text/javascript"}));
  const moduleText = new TextDecoder().decode(bytes(decode("three-module")))
    .split("'./three.core.js'").join(JSON.stringify(coreUrl));
  const moduleUrl = URL.createObjectURL(new Blob([moduleText], {type: "text/javascript"}));
  return import(moduleUrl);
}

const MODEL = readModel();
setHeader(MODEL);
const MISSING = missingKey(MODEL);
if (MISSING) {
  showFallback(MODEL, `This page's data is missing "${MISSING}", so it shows a plain list.`);
} else if (!webglAvailable()) {
  showFallback(MODEL, "This browser cannot draw the factory (no WebGL), so it shows a plain list of every run by station.");
} else {
  loadThree().then((THREE) => factory(THREE, MODEL)).catch((err) => {
    showFallback(MODEL, `The factory could not be drawn (${err.message}), so it shows a plain list.`);
  });
}

// ================================================================ factory
function factory(THREE, model) {
  const COLORS = {
    ground: 0xe8f5ec, plate: 0xf7f8f7, plateSide: 0xd9ddd9, belt: 0xa6e07a,
    frame: 0x6b7078, steel: 0xc9cdd3, dark: 0x5a5f68, accent: 0x8f6fd8,
    crate: 0xd3d6db, tape: 0x9aa0a8, line: 0x2f3238, warn: 0xe0903a,
    glass: 0x8f6fd8, ok: 0x6fd36f, wood: 0xb9bdc4
  };
  const TILE = 12.5, HALF = 6.25, PLATE_H = 0.9, BELT_Y = 1.8, BELT_W = 2.4;
  const CRATE = 1.3;
  const stage = $("stage");
  stage.hidden = false;
  $("fallback").hidden = true;
  $("transport").hidden = false;

  // ----------------------------------------------------- renderer, camera
  const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: false});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(COLORS.ground);
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(0.35, 1, 0.7);
  scene.add(sun);
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 500);
  const target = new THREE.Vector3();

  // --------------------------------------------------------- materials
  const matCache = {};
  const mat = (color) => matCache[color] || (matCache[color] =
    new THREE.MeshLambertMaterial({color, flatShading: true}));
  const lineMat = new THREE.LineBasicMaterial({color: COLORS.line});
  const edgeCache = new WeakMap();
  function outlined(mesh) {
    let edges = edgeCache.get(mesh.geometry);
    if (!edges) { edges = new THREE.EdgesGeometry(mesh.geometry, 25); edgeCache.set(mesh.geometry, edges); }
    mesh.add(new THREE.LineSegments(edges, lineMat));
    return mesh;
  }
  const geoCache = {};
  function boxGeo(w, h, d) {
    const key = `b${w},${h},${d}`;
    return geoCache[key] || (geoCache[key] = new THREE.BoxGeometry(w, h, d));
  }
  function box(w, h, d, color, x = 0, y = 0, z = 0, parent) {
    const mesh = outlined(new THREE.Mesh(boxGeo(w, h, d), mat(color)));
    mesh.position.set(x, y + h / 2, z);
    if (parent) parent.add(mesh);
    return mesh;
  }
  function cyl(r, h, color, x = 0, y = 0, z = 0, parent, seg = 14) {
    const key = `c${r},${h},${seg}`;
    const geo = geoCache[key] || (geoCache[key] = new THREE.CylinderGeometry(r, r, h, seg));
    const mesh = outlined(new THREE.Mesh(geo, mat(color)));
    mesh.position.set(x, y + h / 2, z);
    if (parent) parent.add(mesh);
    return mesh;
  }
  function label(text, {size = 64, color = "#2f3238", bg = null, pad = 18, bold = true} = {}) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    ctx.font = `${bold ? "700" : "500"} ${size}px system-ui, sans-serif`;
    const width = Math.ceil(ctx.measureText(text).width) + pad * 2;
    canvas.width = width; canvas.height = size + pad * 2;
    ctx.font = `${bold ? "700" : "500"} ${size}px system-ui, sans-serif`;
    if (bg) {
      ctx.fillStyle = bg; ctx.strokeStyle = "#2f3238"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.roundRect(3, 3, width - 6, canvas.height - 6, 18);
      ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = color; ctx.textBaseline = "middle";
    ctx.fillText(text, pad, canvas.height / 2 + 2);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = 4;
    return {texture, aspect: width / canvas.height};
  }

  // ------------------------------------------------------------- layout
  // Rows of four; one belt snakes through them in pipeline order. Capture
  // sits behind Idea and feeds the main belt at Architect.
  const GRID = {
    "capture": [0, -1], "idea": [0, 0], "prd": [1, 0], "ux-design": [2, 0],
    "architect": [3, 0], "decompose": [3, 1], "implement": [2, 1],
    "verify": [1, 1], "review": [0, 1], "ship": [0, 2], "operate": [1, 2],
    "completed": [2, 2], "bin": [3, 2]
  };
  const at = (key) => new THREE.Vector3(GRID[key][0] * TILE, 0, GRID[key][1] * TILE);
  const MAIN = ["idea", "prd", "ux-design", "architect", "decompose", "implement",
    "verify", "review", "ship", "operate", "completed"];
  const mainPoints = MAIN.map(at);
  const sidePoints = [at("capture"), new THREE.Vector3(3 * TILE, 0, -TILE), at("architect")];
  function polyline(points) {
    const lengths = [0];
    for (let i = 1; i < points.length; i++) lengths.push(lengths[i - 1] + points[i].distanceTo(points[i - 1]));
    return {points, lengths, total: lengths[lengths.length - 1]};
  }
  const mainPath = polyline(mainPoints), sidePath = polyline(sidePoints);
  function pointOn(path, s) {
    s = Math.max(0, Math.min(path.total, s));
    let i = 1;
    while (i < path.lengths.length - 1 && path.lengths[i] < s) i++;
    const a = path.points[i - 1], b = path.points[i];
    const f = (s - path.lengths[i - 1]) / (path.lengths[i] - path.lengths[i - 1] || 1);
    return a.clone().lerp(b, f);
  }
  const mainParam = Object.fromEntries(MAIN.map((key, i) => [key, mainPath.lengths[i]]));
  // Direction a crate travels when it reaches each station.
  const inDir = {};
  MAIN.forEach((key, i) => {
    const from = i ? mainPoints[i - 1] : mainPoints[0].clone().add(new THREE.Vector3(-1, 0, 0));
    inDir[key] = mainPoints[i].clone().sub(from).normalize();
  });
  inDir.capture = new THREE.Vector3(1, 0, 0);

  // -------------------------------------------------------------- floor
  const pickable = [];
  const stationGroups = {};
  function tag(object, data) {
    object.traverse((child) => { if (child.isMesh) { child.userData.pick = data; pickable.push(child); } });
  }
  function plate(key, title) {
    const group = new THREE.Group();
    group.position.copy(at(key));
    scene.add(group);
    // A thick, two-tone plate with a wide gap to the next: in an
    // isometric view the plate edges are what tell one station from the
    // one behind it.
    const side = mat(COLORS.plateSide), top = mat(COLORS.plate);
    const base = outlined(new THREE.Mesh(boxGeo(TILE - 2.2, PLATE_H, TILE - 2.2),
      [side, side, top, side, side, side]));
    base.position.y = PLATE_H / 2;
    group.add(base);
    if (title) {
      const {texture, aspect} = label(title.toUpperCase(), {size: 60, color: "#2f3238",
        bg: "#ffffff", pad: 16});
      const h = 1.3;
      const sign = new THREE.Mesh(new THREE.PlaneGeometry(h * aspect, h),
        new THREE.MeshBasicMaterial({map: texture, transparent: true, depthTest: false}));
      // Painted flat on the plate's front-left quadrant, turned to read
      // level on screen, and drawn over everything like a map label: in
      // an isometric view the back row of the tile in front would
      // otherwise hide it, and the cold viewer reads the stages here.
      sign.renderOrder = 5;
      sign.rotation.order = "YXZ";
      sign.rotation.set(-Math.PI / 2, Math.PI / 4, 0);
      sign.position.set(-3.1, PLATE_H + 0.02, 3.1);
      group.add(sign);
    }
    return group;
  }
  // The belt: green top on a dark frame, rollers on the sides, legs below.
  function beltSegment(a, b, rollerSpin) {
    const length = a.distanceTo(b);
    if (length < 0.01) return;
    const group = new THREE.Group();
    group.position.copy(a.clone().lerp(b, 0.5));
    group.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
    box(length + BELT_W, 0.5, BELT_W + 0.3, COLORS.frame, 0, BELT_Y - 0.5, 0, group);
    box(length + BELT_W - 0.1, 0.12, BELT_W, COLORS.belt, 0, BELT_Y, 0, group);
    for (let x = -length / 2; x <= length / 2; x += 3) {
      box(0.25, BELT_Y - 0.5, 0.25, COLORS.frame, x, 0, BELT_W / 2 - 0.1, group);
      box(0.25, BELT_Y - 0.5, 0.25, COLORS.frame, x, 0, -BELT_W / 2 + 0.1, group);
    }
    for (let x = -length / 2; x <= length / 2; x += 0.9) {
      const roller = cyl(0.18, 0.1, COLORS.dark, x, 0, BELT_W / 2 + 0.18, group, 8);
      roller.rotation.x = Math.PI / 2;
      roller.position.y = BELT_Y - 0.25;
      rollerSpin.push(roller);
    }
    scene.add(group);
  }
  const rollers = [];
  const plates = {};
  Object.keys(GRID).forEach((key) => {
    plates[key] = plate(key, key === "bin" ? "Needs attention" : nameOf(key));
    stationGroups[key] = plates[key];
  });
  for (let i = 1; i < mainPoints.length; i++) beltSegment(mainPoints[i - 1], mainPoints[i], rollers);
  for (let i = 1; i < sidePoints.length; i++) beltSegment(sidePoints[i - 1], sidePoints[i], rollers);

  // ----------------------------------------------------------- machines
  const animators = [];
  // Machines line up with their belt, their back (local -z) always away
  // from the camera, so workers and arms never hide the tile's label.
  const alongZ = (key) => Math.abs((inDir[key] || new THREE.Vector3(1, 0, 0)).z) > 0.5;
  const align = (group, key) => { group.rotation.y = alongZ(key) ? Math.PI / 2 : 0; };
  function worker(parent, x, z, facing = 0) {
    const person = new THREE.Group();
    person.position.set(x, PLATE_H, z);
    person.rotation.y = facing;
    const legs = box(0.8, 1.4, 0.5, COLORS.accent, 0, 0, 0, person);
    const body = box(1.0, 1.4, 0.6, COLORS.accent, 0, 1.4, 0, person);
    const headGeo = geoCache.head || (geoCache.head = new THREE.SphereGeometry(0.42, 12, 10));
    const head = outlined(new THREE.Mesh(headGeo, mat(0xf2d6c4)));
    head.position.set(0, 3.25, 0);
    person.add(head);
    const hatGeo = geoCache.hat || (geoCache.hat = new THREE.SphereGeometry(0.47, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2));
    const hat = outlined(new THREE.Mesh(hatGeo, mat(COLORS.accent)));
    hat.position.set(0, 3.35, 0);
    person.add(hat);
    const arm = new THREE.Group();
    arm.position.set(0.25, 2.6, 0.35);
    box(0.3, 0.3, 1.2, COLORS.accent, 0, -0.15, 0.55, arm);
    person.add(arm);
    parent.add(person);
    return {person, arm, body, legs};
  }
  function crateMesh(color = COLORS.crate) {
    const mesh = outlined(new THREE.Mesh(boxGeo(CRATE, CRATE * 0.8, CRATE), mat(color)));
    const strip = new THREE.Mesh(boxGeo(CRATE + 0.02, 0.1, 0.3), mat(COLORS.tape));
    strip.position.y = CRATE * 0.4;
    mesh.add(strip);
    return mesh;
  }
  function robotArm(parent, x, z, color = COLORS.belt) {
    const base = new THREE.Group();
    base.position.set(x, PLATE_H, z);
    cyl(0.9, 0.5, COLORS.dark, 0, 0, 0, base);
    const turret = new THREE.Group();
    turret.position.y = 0.5;

  const TRAVEL = 0.6;

    const list = times.get(run);
    let k = -1;
    for (let i = 0; i < list.length; i++) if (list[i].t <= t) k = i;
    if (k < 0) return null;
    const cur = list[k];
    const slice = k + 1 < list.length ? Math.min(1, list[k + 1].t - cur.t) : 1;
    const progress = (t - cur.t) / (slice * TRAVEL || 1);
    const inferredOpen = cur.hop.inferred && t < dayIndex(cur.hop.day) + 1;
    if (k > 0 && progress < 1 && !isToday()) {
      return {station: cur.hop.station, since: cur.t, moving: true,
        from: list[k - 1].hop.station, f: progress, inferred: inferredOpen};

      return s <= sidePath.total ? pointOn(sidePath, s) : pointOn(mainPath, mainParam.architect + s - sidePath.total);
    }

    if (a === undefined || b === undefined) return at(to);

      entry.tray.visible = !!implementing;
      if (implementing) {
        const fraction = isToday() ? doneCount(run) / run.work_orders.length : 0;
        const width = CRATE * 0.9;
        entry.trayFill.scale.x = Math.max(0.001, fraction * width);
        entry.trayFill.position.x = -width / 2 + (fraction * width) / 2;
        entry.trayFill.material = isToday() ? mat(COLORS.ok) : mat(COLORS.steel);
        entry.trayFill.visible = isToday();
      }
      if (state.highlighted === run) entry.mesh.position.y += 1.2;
    });
    showParts();
    $("empty-sign").hidden = runs.length > 0;
  }
  // A highlighted Implement crate opens its tray: one part per work
  // order, finished parts green, open parts grey, laid out above it.
  const partsGroup = new THREE.Group();
  scene.add(partsGroup);
  const partGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.5, 10);
  function showParts() {
    partsGroup.clear();
    const run = state.highlighted;
    const entry = run && crateOf.get(run);
    if (!entry || !entry.where || entry.where.station !== "implement" || !run.work_orders.length) return;
    const per = Math.ceil(Math.sqrt(run.work_orders.length));
    run.work_orders.forEach((wo, i) => {
      const part = outlined(new THREE.Mesh(partGeo,
        mat(wo.done && isToday() ? COLORS.ok : COLORS.steel)));
      part.position.set(entry.mesh.position.x + ((i % per) - (per - 1) / 2) * 0.6,
        entry.mesh.position.y + 1.2,
        entry.mesh.position.z + (Math.floor(i / per) - (per - 1) / 2) * 0.6);
      partsGroup.add(part);
    });
  }

  // --------------------------------------------------------- the camera
  function fit() {
    const width = stage.clientWidth, height = stage.clientHeight;
    renderer.setSize(width, height, false);
    const bounds = new THREE.Box3();
    Object.values(stationGroups).forEach((g) => bounds.expandByPoint(g.position));
    bounds.expandByScalar(HALF + 1);
    bounds.getCenter(target);
    camera.position.copy(target).add(new THREE.Vector3(60, 60, 60));
    camera.lookAt(target);
    camera.updateMatrixWorld();
    // Project the bounds' corners to find the view extent.
    const corners = [];
    for (const x of [bounds.min.x, bounds.max.x]) for (const y of [0, 9])
      for (const z of [bounds.min.z, bounds.max.z]) corners.push(new THREE.Vector3(x, y, z));
    const inv = camera.matrixWorldInverse;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    corners.forEach((c) => {
      const v = c.clone().applyMatrix4(inv);
      minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
      minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
    });
    const spanX = maxX - minX, spanY = maxY - minY;
    const aspect = width / Math.max(1, height);
    const halfH = Math.max(spanY, spanX / aspect) / 2 * 1.04;
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    camera.left = cx - halfH * aspect; camera.right = cx + halfH * aspect;
    camera.top = cy + halfH; camera.bottom = cy - halfH;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", () => { fit(); requestRender(); });

  // --------------------------------------------------------- hover, pin
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const card = $("card");
  function runsAt(key) {
    return runs.filter((run) => {
      const where = crateOf.get(run).where;
      return where && !where.moving && where.station === key;
    }).sort((a, b) => crateOf.get(a).where.since - crateOf.get(b).where.since);
  }
  const asOf = () => isToday() ? model.generated.slice(0, 10) : currentDay();
  function skippedOf(run) {
    return run.ladder.filter((row) => row.state === "skipped").map((row) => nameOf(row.stage));
  }
  function aheadOf(run) {
    const i = run.ladder.findIndex((row) => row.state === "current");
    if (i < 0) return [];
    return run.ladder.slice(i + 1).filter((row) => row.state === "done").map((row) => nameOf(row.stage));
  }
  function stationCard(key) {
    const here = runsAt(key);
    const [name, line] = key === "bin" ? ["Needs attention", "Runs the placement tool could not read."]
      : STATION_INFO[key];
    const oldest = here.slice(0, 5).map((run) => run.slug).join(", ");
    card.replaceChildren(el("h3", {}, name), el("p", {}, line),
      el("p", {class: "muted"}, `${here.length} run${here.length === 1 ? "" : "s"} · as of ${asOf()}`),
      el("p", {}, here.length ? `oldest: ${oldest}${here.length > 5 ? ", …" : ""}` : "0 runs"));
  }
  function crateCard(run) {
    const where = crateOf.get(run).where;
    const rows = [el("h3", {}, `crate: ${run.ref}`)];
    if (run.status === "attention") {
      rows.push(el("p", {}, run.dir), el("p", {}, run.reason));
    } else {
      const station = where ? nameOf(where.station) : "";
      let line = `${run.kind} · at ${station}`;
      if (where && where.station === "implement" && run.work_orders.length)
        line += ` · ${doneCount(run)}/${run.work_orders.length} WOs${isToday() ? "" : " (today)"}`;
      rows.push(el("p", {}, line), el("p", {class: "muted"}, run.dir));
      const skipped = skippedOf(run), ahead = aheadOf(run);
      if (skipped.length) rows.push(el("p", {}, `skipped: ${skipped.join(", ")}`));
      if (ahead.length) rows.push(el("p", {}, `already has: ${ahead.join(", ")}`));
    }
    card.replaceChildren(...rows);
  }
  function pick(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(pickable, false).filter((hit) => {
      let o = hit.object; while (o) { if (!o.visible) return false; o = o.parent; } return true;
    });
    const crate = hits.find((hit) => hit.object.userData.pick.kind === "crate");
    return (crate || hits[0] || {}).object ? (crate || hits[0]).object.userData.pick : null;
  }
  renderer.domElement.addEventListener("pointermove", (event) => {
    const hit = pick(event);
    if (!hit) { card.hidden = true; renderer.domElement.style.cursor = ""; return; }
    if (hit.kind === "station") stationCard(hit.station); else crateCard(hit.run);
    const rect = stage.getBoundingClientRect();
    card.hidden = false;
    const x = Math.min(event.clientX - rect.left + 16, rect.width - card.offsetWidth - 8);
    const y = Math.min(event.clientY - rect.top + 16, rect.height - card.offsetHeight - 8);
    card.style.left = `${x}px`; card.style.top = `${y}px`;
    renderer.domElement.style.cursor = "pointer";
  });
  renderer.domElement.addEventListener("pointerleave", () => { card.hidden = true; });
  function closePanel() {
    $("panel").hidden = true; state.pinned = null; state.highlighted = null; layout(); requestRender();
  }
  function runRow(run, open) {
    const summary = el("summary", {});
    summary.append(el("span", {}, run.ref));
    if (run.work_orders.length) summary.append(el("span", {class: "prog"},
      `${doneCount(run)}/${run.work_orders.length}${isToday() ? "" : " ·today"}`));
    const details = el("details", {}, summary);
    if (open) details.open = true;
    if (run.status === "attention") details.append(el("p", {class: "muted"}, run.reason));
    else details.append(el("p", {class: "muted"}, run.dir));
    if (run.work_orders.length) {
      if (!isToday()) details.append(el("p", {class: "muted"}, "progress as of today"));
      const ul = el("ul", {});
      run.work_orders.forEach((wo) => ul.append(el("li", {class: wo.done ? "done" : "open"}, wo.title)));
      details.append(ul);
    }
    summary.addEventListener("click", () => { state.highlighted = run; layout(); requestRender(); });
    return details;
  }
  function openPanel(hit) {
    const key = hit.kind === "station" ? hit.station : (crateOf.get(hit.run).where || {}).station;
    if (!key) return;
    state.pinned = {key, run: hit.kind === "crate" ? hit.run : null};
    renderPanel();
  }
  function renderPanel() {
    if (!state.pinned) return;
    const {key, run} = state.pinned;
    const here = runsAt(key);
    $("panel-title").textContent = `${key === "bin" ? "Needs attention" : nameOf(key)} · as of ${asOf()}`;
    const body = $("panel-body");
    body.replaceChildren(el("p", {class: "muted"}, here.length
      ? `${here.length} run${here.length === 1 ? "" : "s"}, oldest first` : `No runs here as of ${asOf()}`));
    here.forEach((r) => body.append(runRow(r, r === run)));
    $("panel").hidden = false;
    if (run) { state.highlighted = run; layout(); }
  }
  renderer.domElement.addEventListener("click", (event) => {
    const hit = pick(event);
    if (!hit) { closePanel(); return; }
    openPanel(hit);
    requestRender();
  });
  $("panel-close").addEventListener("click", closePanel);
  addEventListener("keydown", (event) => { if (event.key === "Escape") closePanel(); });

  // ---------------------------------------------------------- transport
  const play = $("play"), scrub = $("scrub");
  scrub.min = String(FIRST); scrub.max = String(LAST + 1); scrub.value = String(LAST + 1);
  function dayLabel() { return isToday() ? `${model.generated.slice(0, 10)} (today)` : currentDay(); }
  function syncTransport() {
    if (!state.playing) scrub.value = String(Math.round(state.t));
    $("day").textContent = dayLabel();
    play.textContent = state.playing ? "❚❚ Pause" : "▶ Play";
    play.setAttribute("aria-label", state.playing ? "Pause the replay" : "Play the replay");
    setHeader(model, isToday() ? null : currentDay());
  }
  const enabled = runs.length > 0;
  [play, scrub, $("speed-30"), $("speed-60"), $("export")].forEach((b) => { b.disabled = !enabled; });
  play.addEventListener("click", () => {
    if (state.playing) { state.playing = false; }
    else { if (isToday()) state.t = FIRST; state.playing = true; }
    syncTransport(); requestRender();
  });
  scrub.addEventListener("input", () => {
    state.playing = false;
    state.t = Number(scrub.value) >= LAST + 1 ? LAST + 1 : Number(scrub.value) + 1 - 1e-6;
    layout(); syncTransport(); renderPanel(); requestRender();
  });
  ["30", "60"].forEach((s) => $(`speed-${s}`).addEventListener("click", () => {
    state.seconds = Number(s);
    $("speed-30").setAttribute("aria-pressed", String(s === "30"));
    $("speed-60").setAttribute("aria-pressed", String(s === "60"));
  }));

  // -------------------------------------------------------------- loop
  let needsRender = true, last = performance.now(), clock = 0;
  const fps = {frames: 0, since: performance.now(), value: 0, samples: []};
  window.__assemblyLine = {fps, state, runs, crateOf, layout, LAST, FIRST, renderer, camera, scene};
  function requestRender() { needsRender = true; }
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (state.playing) {
      state.t += dt * (LAST + 1 - FIRST) / state.seconds;
      if (state.t >= LAST + 1) { state.t = LAST + 1; state.playing = false; renderPanel(); }
      layout(); syncTransport(); needsRender = true;
    }
    if (!reducedMotion) {
      clock += dt;
      animators.forEach((animate) => animate(clock));
      rollers.forEach((roller) => { roller.rotation.y += dt * 4; });
      needsRender = true;
    }
    if (needsRender) { renderer.render(scene, camera); needsRender = false; }
    fps.frames++;
    if (now - fps.since >= 1000) {
      fps.value = fps.frames * 1000 / (now - fps.since);
      fps.samples.push(fps.value);
      fps.frames = 0; fps.since = now;
    }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------- GIF export
  $("export").addEventListener("click", () => exportGif().catch((err) => {
    const status = $("export-status");
    status.hidden = false;
    status.textContent = `Export failed: ${err.message}. Nothing was downloaded.`;
    restoreAfterExport();
  }));
  let saved = null;
  function restoreAfterExport() {
    if (!saved) return;
    state.t = saved.t; state.playing = false;
    renderer.setPixelRatio(saved.ratio);
    stage.style.width = ""; stage.style.height = ""; stage.style.flex = "";
    fit(); layout(); syncTransport(); requestRender();
    $("export").disabled = !enabled; play.disabled = !enabled;
    saved = null;
  }
  async function exportGif() {
    const W = 720, H = 450, FPS = 10, PLAY_SECONDS = 12, HOLD_FRAMES = 20;
    const status = $("export-status");
    status.hidden = false;
    status.textContent = "Exporting clip…";
    saved = {t: state.t, ratio: renderer.getPixelRatio()};
    state.playing = false;
    $("export").disabled = true; play.disabled = true;
    stage.style.flex = "none"; stage.style.width = `${W}px`; stage.style.height = `${H}px`;
    renderer.setPixelRatio(1);
    fit();
    const grab = document.createElement("canvas");
    grab.width = W; grab.height = H;
    const ctx = grab.getContext("2d", {willReadFrequently: true});
    // The palette comes from today's frame: every crate and machine on it.
    state.t = LAST + 1;
    layout();
    renderer.render(scene, camera);
    ctx.drawImage(renderer.domElement, 0, 0, W, H);
    const gif = new GifWriter(W, H, ctx.getImageData(0, 0, W, H).data);
    // Each clip frame carries the repo and the replay's date, top left:
    // a README viewer has no transport bar to read it from.
    const stamp = (text) => {
      ctx.font = "600 15px system-ui, sans-serif";
      const width = ctx.measureText(text).width + 20;
      ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#2f3238"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(10, 10, width, 28, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2f3238"; ctx.textBaseline = "middle"; ctx.fillText(text, 20, 25);
    };
    const total = FPS * PLAY_SECONDS;
    for (let i = 0; i <= total + HOLD_FRAMES; i++) {
      state.t = Math.min(LAST + 1, FIRST + (LAST + 1 - FIRST) * Math.min(1, i / total));
      layout();
      const tclock = i / FPS;
      if (!reducedMotion) animators.forEach((animate) => animate(tclock));
      renderer.render(scene, camera);
      ctx.drawImage(renderer.domElement, 0, 0, W, H);
      stamp(`${model.repo} · ${isToday() ? `${model.generated.slice(0, 10)} (today)` : currentDay()}`);
      gif.frame(ctx.getImageData(0, 0, W, H).data, i === total + HOLD_FRAMES ? 300 : 100 / FPS);
      if (i % 10 === 0) {
        status.textContent = `Exporting clip… ${Math.round(100 * i / (total + HOLD_FRAMES))}%`;
        await new Promise((resolve) => setTimeout(resolve, 0));
      }
    }
    const blob = new Blob([gif.finish()], {type: "image/gif"});
    const link = el("a", {href: URL.createObjectURL(blob), download: `${model.repo}-assembly-line.gif`});
    document.body.append(link);
    link.click();
    link.remove();
    window.__assemblyLine.lastGif = blob;
    status.textContent = `Clip exported (${(blob.size / 1048576).toFixed(1)} MB). Commit it and reference it from your README as an image.`;
    restoreAfterExport();
  }

  // ------------------------------------------------------------- start
  fit();
  layout();
  syncTransport();
  requestAnimationFrame(frame);
}

// ================================================================ GIF89a
// A first-party encoder. The global palette is the 256 most frequent
// 5-bit colours of a sample frame — the floor's flat shading uses few
// colours, so they all fit — with a nearest-colour lookup for the rest;
// LZW per frame, looping forever.
class GifWriter {
  constructor(width, height, sample) {
    this.width = width; this.height = height;
    this.chunks = [];
    const counts = new Uint32Array(32768);
    for (let q = 0; q < sample.length; q += 4)
      counts[((sample[q] >> 3) << 10) | ((sample[q + 1] >> 3) << 5) | (sample[q + 2] >> 3)]++;
    const bins = Array.from(counts.keys()).filter((bin) => counts[bin])
      .sort((a, b) => counts[b] - counts[a]).slice(0, 256);
    this.palette = new Uint8Array(256 * 3);
    const rgb = (bin) => [((bin >> 10) << 3) | 4, (((bin >> 5) & 31) << 3) | 4, ((bin & 31) << 3) | 4];
    bins.forEach((bin, i) => this.palette.set(rgb(bin), i * 3));
    this.lookup = new Uint8Array(32768);
    for (let bin = 0; bin < 32768; bin++) {
      const [r, g, b] = rgb(bin);
      let best = 0, bestDistance = Infinity;
      for (let i = 0; i < bins.length; i++) {
        const dr = r - this.palette[i * 3], dg = g - this.palette[i * 3 + 1], db = b - this.palette[i * 3 + 2];
        const distance = dr * dr + dg * dg + db * db;
        if (distance < bestDistance) { bestDistance = distance; best = i; }
      }
      this.lookup[bin] = best;
    }
    const head = [0x47, 0x49, 0x46, 0x38, 0x39, 0x61,
      width & 255, width >> 8, height & 255, height >> 8, 0xf7, 0, 0];
    this.chunks.push(new Uint8Array(head), this.palette,
      new Uint8Array([0x21, 0xff, 0x0b, ...Array.from("NETSCAPE2.0", (c) => c.charCodeAt(0)),
        0x03, 0x01, 0x00, 0x00, 0x00]));
  }
  frame(rgba, delayCs) {
    const n = this.width * this.height;
    const indices = new Uint8Array(n);
    for (let p = 0, q = 0; p < n; p++, q += 4)
      indices[p] = this.lookup[((rgba[q] >> 3) << 10) | ((rgba[q + 1] >> 3) << 5) | (rgba[q + 2] >> 3)];
    const delay = Math.max(2, Math.round(delayCs));
    this.chunks.push(new Uint8Array([0x21, 0xf9, 0x04, 0x00, delay & 255, delay >> 8, 0, 0,
      0x2c, 0, 0, 0, 0, this.width & 255, this.width >> 8, this.height & 255, this.height >> 8, 0]));
    this.chunks.push(lzw(indices, 8));
  }
  finish() {
    this.chunks.push(new Uint8Array([0x3b]));
    return new Blob(this.chunks);
  }
}
// GIF LZW: variable-width codes, a clear code when the table fills, and
// the width step taken before the code that needs it (the decoder's
// table lags the encoder's by one entry). Sub-blocks of 255 bytes.
function lzw(indices, minCodeSize) {
  const clear = 1 << minCodeSize, end = clear + 1;
  const out = [minCodeSize];
  let block = [], cur = 0, bits = 0, size = minCodeSize + 1;
  const emitByte = (byte) => {
    block.push(byte);
    if (block.length === 255) { out.push(255); for (const b of block) out.push(b); block = []; }
  };
  const write = (code) => {
    cur |= code << bits; bits += size;
    while (bits >= 8) { emitByte(cur & 255); cur >>>= 8; bits -= 8; }
  };
  let table = new Map(), next = end + 1;
  write(clear);
  let prefix = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i];
    const key = (prefix << 8) | k;
    const found = table.get(key);
    if (found !== undefined) { prefix = found; continue; }
    write(prefix);
    if (next === 4096) {
      write(clear);
      table = new Map(); next = end + 1; size = minCodeSize + 1;
    } else {
      if (next >= (1 << size)) size++;
      table.set(key, next++);
    }
    prefix = k;
  }
  write(prefix);
  write(end);
  if (bits > 0) emitByte(cur & 255);
  if (block.length) { out.push(block.length); for (const b of block) out.push(b); }
  out.push(0);
  return Uint8Array.from(out);
}
