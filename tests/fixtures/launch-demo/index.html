<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter and greeter — launch-demo fixture</title>
<style>
  body { font: 20px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 40rem; color: #1d1b17; }
  h1 { font-size: 2rem; }
  section { margin: 2rem 0; }
  button, input { font: inherit; padding: 0.4rem 0.8rem; }
  #total, #out { font-weight: 600; }
</style>
</head>
<body>
<h1>Counter and greeter</h1>
<section>
  <p>Clicks so far: <span id="total">0</span></p>
  <button id="count">Count one more</button>
</section>
<section>
  <label for="name">Your name</label>
  <input id="name" type="text" placeholder="Ada">
  <button id="greet">Say hello</button>
  <p id="out"></p>
</section>
<script>
  var total = 0;
  document.getElementById("count").addEventListener("click", function () {
    total += 1;
    document.getElementById("total").textContent = String(total);
  });
  document.getElementById("greet").addEventListener("click", function () {
    var name = document.getElementById("name").value || "stranger";
    document.getElementById("out").textContent = "Hello, " + name + "!";
  });
</script>
</body>
</html>
