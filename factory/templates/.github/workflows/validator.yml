# The factory validator (PRD-0001; ADR-0032, ADR-0033).
#
# Mirrored VERBATIM into the template payload by `factory_init.py
# update-manifest`, so a stamped product repo runs this same file — which is
# why it names no repo tool of its own. Every tool invocation goes through a
# `make` target, and the Makefile knows where that repo keeps its tools (root
# here, tools/factory/ there); what is left is plumbing that does not move
# between repos — gh, git, and the check job's findings hand-off. Editing
# this file means re-running update-manifest; detector E fails the build
# otherwise.
name: validator

on:
  push:
  pull_request:
    # `edited` is here because detector B reads the PR body: the body is
    # an INPUT to the check, so correcting it has to re-run the check.
    # Without it the only way to re-check a fixed body is close/reopen,
    # and a re-run is no help — it replays the payload it was dispatched
    # with, stale body and all (issue #216).
    types: [opened, reopened, synchronize, edited, closed]
  # The factory's own PRs never arrive as pull_request events: the agent
  # opens them with the workflow's GITHUB_TOKEN, whose events GitHub
  # suppresses (WO-0030). The assembler hands gate 3 the PR by number
  # through this trigger — the one event exempt from the suppression.
  # Each dispatched job synthesizes the pull_request payload from the
  # REST API (the same object shape a webhook delivers) and hands it over
  # as FACTORY_EVENT_PATH — $GITHUB_ENV cannot overwrite GITHUB_EVENT_PATH —
  # which cli.read_event prefers, so the make steps read one shape on both
  # paths.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to validate (a factory-opened PR)"
        required: true

permissions:
  contents: read

jobs:
  # Gate 3's status check (ADR-0033): detectors and tests on every push and
  # every PR. Nothing else in this workflow can fail the build.
  # This is the ONE job that runs the pull request's code (ADR-0098), so it
  # holds read grants only and its checkout leaves no token in .git/config.
  # Its captured output crosses to the review job as one job output of plain
  # text; the verdict crosses as this job's result, which GitHub computes.
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # pull-requests: read — the dispatch shim reads the PR through gh api,
    # which a private repo refuses with contents alone (run 36093103416).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings: ${{ steps.handoff.outputs.findings }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatched run checks the dispatched PR's head; every other
          # event keeps checkout's default ref ('' falls through to it).
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || '' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthesize the PR event payload
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          make pr-event PR="$PR" EVENT="${RUNNER_TEMP}/pr-event.json"
          echo "FACTORY_EVENT_PATH=${RUNNER_TEMP}/pr-event.json" >> "$GITHUB_ENV"
      # pipefail is load-bearing: a run: with no shell: is `bash -e {0}`,
      # which has none, so without it tee's exit 0 would turn a failing
      # check green.
      - name: Detectors and tests
        run: |
          set -o pipefail
          make check 2>&1 | tee "$RUNNER_TEMP/findings.txt"
      # The hand-off (ADR-0098): the first 64 KiB of the output, under a
      # delimiter that is random per run, as the job's one declared output.
      # Runs on a failed check too: a red check is what the reviewer most
      # needs to show.
      - name: Hand the findings to the review job
        id: handoff
        if: ${{ !cancelled() }}
        run: |
          delim="findings-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "findings<<$delim"
            head -c 65536 "$RUNNER_TEMP/findings.txt" || true
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  # The agent reviewer (ADR-0033) pre-chews every PR so the human gate is
  # judgment, not linting.
  # It runs BASE code only (ADR-0098): the PR's code runs in `check`, and
  # this job holds the reviewer's PAT, so it checks out the PR's base commit
  # on pull_request and the default branch BY NAME on workflow_dispatch —
  # never github.sha, which is whatever ref the dispatcher passed (a
  # `--ref <pr-branch>` dispatch would make it the agent's head) — and
  # never the PR's head or merge ref. It takes check's output across as
  # data. A PR that changes the review path is reviewed by the base's
  # version of it. The verdict is check's result; the findings text is
  # written to a file by a step with no secret and no make, because make
  # imports its env as make variables, and is never interpolated into a
  # run: script.
  # PRD-0001 forbids the actor that produced the work
  # from verifying it: validator.py compares the PR author with the identity
  # the review TOKEN actually posts as — asking the token who it is (gh api
  # user), not trusting a variable that declares it. Give the reviewer its own
  # identity with the FACTORY_REVIEW_TOKEN secret (a PAT for a login that does
  # not author PRs); with no secret set, GH_TOKEN is this workflow's own
  # GITHUB_TOKEN, which GitHub fixes to github-actions[bot]. Both env values
  # below are driven by that ONE condition, so the token and the identity
  # cannot disagree. FACTORY_REVIEW_LOGIN is an optional cross-check only: set
  # it and a token that posts as anyone else refuses to post.
  # ANY other caller of `make review` (an assembler re-review job, say) must
  # declare FACTORY_REVIEW_TOKEN_SET the same way: an absent flag is not
  # "false", it refuses to post. A caller that hands over a bot's PAT while
  # saying nothing would otherwise be assumed to post as github-actions[bot].
  # Fork PRs are skipped — their GITHUB_TOKEN is read-only, and reaching for
  # pull_request_target to work around that would run untrusted code with a
  # write token.
  # The action list is an ALLOW-list, not `!= 'closed'`: the reviewer posts
  # a comment per run, and `edited` (added for detector B) would otherwise
  # enrol it in every title and body tweak. Naming the three actions keeps
  # any future trigger type from signing the reviewer up silently.
  # The workflow_dispatch arm is the factory path (WO-0030): only this
  # repo's workflows and collaborators with write can dispatch, and the
  # factory's PRs are same-repo branch PRs, so the fork guard's concern
  # cannot arise there.
  review:
    needs: check
    if: >-
      always()
      && (needs.check.result == 'success' || needs.check.result == 'failure')
      && ((github.event_name == 'pull_request'
           && (github.event.action == 'opened'
               || github.event.action == 'reopened'
               || github.event.action == 'synchronize')
           && github.event.pull_request.head.repo.full_name == github.repository)
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || format('refs/heads/{0}', github.event.repository.default_branch) }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthesize the PR event payload
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          make pr-event PR="$PR" EVENT="${RUNNER_TEMP}/pr-event.json"
          echo "FACTORY_EVENT_PATH=${RUNNER_TEMP}/pr-event.json" >> "$GITHUB_ENV"
      - name: Write the handed-over findings
        env:
          HANDED_OVER: ${{ needs.check.outputs.findings }}
        run: printf '%s' "$HANDED_OVER" > "$RUNNER_TEMP/findings.txt"
      - name: Post findings as a non-authoring actor
        env:
          GH_TOKEN: ${{ secrets.FACTORY_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          FACTORY_REVIEW_TOKEN_SET: ${{ secrets.FACTORY_REVIEW_TOKEN != '' }}
          FACTORY_REVIEW_LOGIN: ${{ vars.FACTORY_REVIEW_LOGIN }}
          CHECK_RC: ${{ needs.check.result == 'success' && '0' || '1' }}
        run: make review FINDINGS="$RUNNER_TEMP/findings.txt" STATUS="$CHECK_RC"

  # PR open flips the cited work order to wo:needs-review — the merge
  # gate's queue-entry event (ADR-0033 gate 3; ADR-0041's latency rows
  # measure its passage, and without this flip the digest's review-queue
  # math never sees an entry). The job runs the validator's pr-opened
  # verb, which owns the uncited rule: a PR that cites no work order
  # (human housekeeping) is normal traffic, not an error. A push to
  # an open PR (synchronize) must not re-flip an order a human already
  # moved along; a REOPENED PR re-enters the queue deliberately — it is
  # again awaiting review. Fork PRs are skipped for the same reason as the
  # review job: their token cannot write labels.
  needs-review-label:
    if: >-
      (github.event_name == 'pull_request'
       && (github.event.action == 'opened' || github.event.action == 'reopened')
       && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # The base on both paths, the same as the reviewer's (ADR-0098):
      # this job holds issues: write, so it must not run the PR's
      # Makefile — checkout's default ref on pull_request is the PR's
      # merge commit, and github.sha on a `--ref <pr-branch>` dispatch is
      # the PR's head. The breakdown row the flip reads landed on the
      # default branch before the mirror existed (ADR-0032), so base is
      # where it lives anyway.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || format('refs/heads/{0}', github.event.repository.default_branch) }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthesize the PR event payload
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          make pr-event PR="$PR" EVENT="${RUNNER_TEMP}/pr-event.json"
          echo "FACTORY_EVENT_PATH=${RUNNER_TEMP}/pr-event.json" >> "$GITHUB_ENV"
      - name: Flip the work order to wo:needs-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make wo-needs-review

  # Merging the PR is gate 3 itself (ADR-0033), and it is the work order's
  # terminal state: flip the mirrored issue to wo:merged (ADR-0032 — exactly
  # one lifecycle label at a time). The issue number comes from the breakdown
  # row, so the mirror stays one-way.
  merged-label:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Flip the work order to wo:merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make wo-merged
